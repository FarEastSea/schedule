name: QQZone Sever

run-name: Updata_QQZone deploy to ${{ inputs.deploy_target }} by @${{ github.actor }}

on:
  workflow_dispatch:

jobs:
  Updata_QQZone:
    name: Updata QQ Zone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.AUTO_UPDATA }}
          sparse-checkout: |
            program/QQZone.py
            Zone

      - name: run python
        env:
          QQZONECOOKIES: ${{ secrets.QQZONECOOKIES }}
          QQ: ${{ secrets.QQ }}
          QQ_TOKEN: ${{ secrets.QQ_TOKEN }}
        run: |
          python program/QQZone.py
          git add Zone/.
          if git diff --cached --quiet; then
            echo "Source has not updata."
            exit 0
          fi
          git config --global user.name "${{ secrets.user_name || 'github-actions[bot]' }}"
          git config --global user.email "${{ secrets.user_email || '41898282+github-actions[bot]@users.noreply.github.com' }}"
          git commit -m 'Update QQ Zone'
          git push

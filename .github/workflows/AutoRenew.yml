name: Renew APP

run-name: Renew App from ${{ inputs.deploy_target }} by @${{ github.actor }}

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  Renew_Web_APP:
    name: Update Web APP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            program/自动续期.py
            program/mail.py
            requirements.txt

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install requirements
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Renew app
        env:
          WEBAPP_USERNAME: ${{ secrets.WEBAPP_USERNAME }}
          WEBAPP_PASSWORD: ${{ secrets.WEBAPP_PASSWORD }}
          MAIL_ARGV: ${{ secrets.MAIL_ARGV }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          SENDER_USERNAME: ${{ secrets.SENDER_USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          RECEIVER_NAME: ${{ secrets.RECEIVER_NAME || secrets.receiver_name }}
          RECEIVER_USERNAME: ${{ secrets.RECEIVER_USERNAME }}
        run: |
          if .venv/bin/python program/自动续期.py; then
            echo "PythonAnywhere自动续期任务结果：续期成功，不发送邮件"
          else
            echo "PythonAnywhere自动续期任务结果：续期失败，发送邮件"
            .venv/bin/python program/mail.py
            exit 1
          fi

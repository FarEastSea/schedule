name: Selenium login

on:
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            program/SeleniumLogin.py

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install selenium
        run: |
          uv venv
          uv pip install selenium

      - name: Run Selenium Test
        run: |
          .venv/bin/python program/SeleniumLogin.py

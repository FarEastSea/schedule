name: VPN Sever

run-name: UpdateVPN by @${{ github.actor }}

on:
  schedule:
    # 上游通常在 05:00-07:35 UTC 更新，08:15 UTC 主拉取，16:15 UTC 兜底
    - cron: '15 8,16 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  VPN_GET_AND_SAVE:
    name: Update URL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.AUTO_UPDATA }}
          sparse-checkout: |
            program/UpdataUrl.py
            free

      - name: Good morning in the morning!
        if: github.event.schedule == '15 8 * * *'
        run: echo Good morning, world!

      - name: Run update script and commit changes
        timeout-minutes: 3
        run: |
          python program/UpdataUrl.py

          git add free/
          if git diff --cached --quiet; then
            echo "No updates detected."
            exit 0
          fi

          git config --global user.name "${{ secrets.user_name || 'github-actions[bot]' }}"
          git config --global user.email "${{ secrets.user_email || '41898282+github-actions[bot]@users.noreply.github.com' }}"
          git commit -m 'Update Daily'
          git push
